      .docs-layout {
        display: flex;
        width: min(calc(100% - 32px), var(--shell));
        margin: 0 auto;
        padding-top: 80px;
        min-height: 100vh;
        gap: 0;
      }

      /* ── Sidebar ── */
      .docs-sidebar {
        width: 280px;
        min-width: 280px;
        border-right: 1px solid var(--line);
        padding: 24px 16px 60px 0;
        overflow-y: auto;
        max-height: calc(100vh - 80px);
        position: sticky;
        top: 80px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.1) transparent;
      }

      .docs-sidebar::-webkit-scrollbar { width: 4px; }
      .docs-sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

      .sidebar-search {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 10px;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        margin-bottom: 20px;
      }

      .sidebar-search svg { opacity: 0.4; flex-shrink: 0; }

      .sidebar-search input {
        background: none;
        border: none;
        outline: none;
        color: var(--ink);
        font-family: "Chakra Petch", sans-serif;
        font-size: 0.88rem;
        width: 100%;
      }

      .sidebar-search input::placeholder { color: rgba(255,255,255,0.3); }

      .sidebar-category {
        margin-bottom: 6px;
      }

      .sidebar-category-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        cursor: pointer;
        user-select: none;
        border-radius: 8px;
        transition: background 0.15s;
      }

      .sidebar-category-header:hover {
        background: rgba(255,255,255,0.04);
      }

      .sidebar-category-header:hover .cat-label {
        color: var(--red-bright);
      }

      .sidebar-category-header .arrow {
        font-size: 0.6rem;
        opacity: 0.4;
        transition: transform 0.2s;
        flex-shrink: 0;
      }

      .sidebar-category.collapsed .arrow {
        transform: rotate(-90deg);
      }

      .sidebar-category-header .cat-label {
        font-family: "Oxanium", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .sidebar-category-body {
        overflow: hidden;
        transition: max-height 0.25s ease;
      }

      .sidebar-category.collapsed .sidebar-category-body {
        max-height: 0 !important;
      }

      .sidebar-product {
        margin-left: 8px;
      }

      .sidebar-product-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        cursor: pointer;
        user-select: none;
        border-radius: 6px;
        font-size: 0.88rem;
        font-weight: 600;
        color: #d4c8c8;
        transition: background 0.15s, color 0.15s;
      }

      .sidebar-product-header:hover {
        background: rgba(255,255,255,0.04);
        color: var(--red-bright);
      }

      .sidebar-product-header .p-arrow {
        font-size: 0.55rem;
        opacity: 0.35;
        transition: transform 0.2s;
        flex-shrink: 0;
      }

      .sidebar-product.collapsed .p-arrow {
        transform: rotate(-90deg);
      }

      .sidebar-product-body {
        overflow: hidden;
        transition: max-height 0.25s ease;
      }

      .sidebar-product.collapsed .sidebar-product-body {
        max-height: 0 !important;
      }

      .sidebar-topic {
        display: block;
        padding: 5px 10px 5px 28px;
        font-size: 0.84rem;
        color: #9a8e8e;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .sidebar-topic:hover {
        background: rgba(255,255,255,0.04);
        color: var(--red-bright);
      }

      .sidebar-topic.active {
        background: rgba(255, 42, 42, 0.1);
        color: var(--red-dark);
        border-left: 2px solid var(--red);
        padding-left: 26px;
      }

      /* ── Main content ── */
      .docs-content {
        flex: 1;
        padding: 24px 0 80px 48px;
        min-width: 0;
      }

      .docs-content-eyebrow {
        margin: 0 0 8px;
        color: var(--red-dark);
        font-family: "Oxanium", sans-serif;
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .docs-content-eyebrow[hidden] {
        display: none;
      }

      .docs-content-title {
        font-family: "Oxanium", sans-serif;
        font-size: 2rem;
        font-weight: 700;
        margin: 0 0 16px;
        color: var(--ink);
      }

      .docs-content-body {
        color: var(--ink-soft);
        line-height: 1.8;
        font-size: 0.95rem;
      }

      .docs-content-body p {
        margin: 0 0 16px;
      }

      .docs-content-body h3 {
        color: var(--ink);
        font-family: "Oxanium", sans-serif;
        font-size: 1.15rem;
        margin: 28px 0 10px;
      }

      .docs-content-body ol,
      .docs-content-body ul {
        padding-left: 22px;
        margin: 0 0 16px;
      }

      .docs-content-body li {
        margin-bottom: 8px;
      }

      .docs-content-body a {
        color: var(--red-dark);
        text-decoration: underline;
      }

      .docs-content-body code {
        background: rgba(255,255,255,0.06);
        padding: 2px 7px;
        border-radius: 5px;
        font-size: 0.88rem;
        color: var(--red-dark);
      }

      .docs-content-body .info-box {
        padding: 14px 18px;
        border-radius: 10px;
        background: rgba(255, 42, 42, 0.06);
        border: 1px solid rgba(255, 42, 42, 0.15);
        margin: 16px 0;
        font-size: 0.9rem;
        color: #d4c8c8;
      }

      .docs-content-body .warn-box {
        padding: 14px 18px;
        border-radius: 10px;
        background: rgba(255, 180, 40, 0.06);
        border: 1px solid rgba(255, 180, 40, 0.15);
        margin: 16px 0;
        font-size: 0.9rem;
        color: #d4c8c8;
      }

      .instruction-video {
        margin: 22px 0;
      }

      .instruction-video video {
        display: block;
        width: 100%;
        max-height: 560px;
        border-radius: 14px;
        background: #080808;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .docs-next {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 32px;
        padding: 18px 22px;
        border-radius: 14px;
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--line);
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
      }

      .docs-next:hover {
        border-color: rgba(255, 48, 48, 0.3);
        background: rgba(255,255,255,0.05);
      }

      .docs-next-label {
        font-size: 0.78rem;
        color: #9a8e8e;
        margin-bottom: 4px;
      }

      .docs-next-title {
        font-weight: 600;
        color: var(--ink);
        font-size: 0.95rem;
      }

      .docs-next-arrow {
        color: var(--red-dark);
        font-size: 1.2rem;
      }

      /* ── Mobile sidebar ── */
      .docs-mobile-toggle {
        display: none;
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 100;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--red);
        color: #fff;
        border: none;
        font-size: 1.3rem;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(255, 42, 42, 0.35);
        align-items: center;
        justify-content: center;
      }

      @media (max-width: 860px) {
        .docs-layout { padding-top: 70px; }

        .docs-sidebar {
          position: fixed;
          top: 0;
          left: -300px;
          width: 280px;
          min-width: 280px;
          height: 100vh;
          max-height: 100vh;
          background: #0a0a0c;
          z-index: 200;
          padding: 24px 16px;
          border-right: 1px solid var(--line);
          transition: left 0.25s ease;
        }

        .docs-sidebar.open {
          left: 0;
        }

        .docs-overlay {
          display: none;
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.6);
          z-index: 199;
        }

        .docs-sidebar.open ~ .docs-overlay {
          display: block;
        }

        .docs-content {
          padding-left: 0;
        }

        .docs-mobile-toggle {
          display: flex;
        }
      }
    </style>
  </head>

    <script type="module">
      import { initReveal } from "../scripts/site.js";
      import { dedicatedRftGuides } from "../data/dedicated-guides.js";
      initReveal();

      /* ── Instruction Data ── */
      const escapeGuideHtml = (value) => String(value ?? "").replace(/[&<>\"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      })[character]);

      const guideLink = (url, label) => url
        ? `<li><strong>${escapeGuideHtml(label)}:</strong> <a href="${escapeGuideHtml(url)}" target="_blank" rel="noopener noreferrer">Open link</a></li>`
        : "";

      function setupFlowHtml(guide) {
        if (guide.setup) {
          const steps = (guide.setup.steps || [])
            .map((step) => `<li>${escapeGuideHtml(step)}</li>`)
            .join("");
          return `
                    <h3>${escapeGuideHtml(guide.setup.title || "Product-specific setup")}</h3>
                    ${guide.setup.intro ? `<p>${escapeGuideHtml(guide.setup.intro)}</p>` : ""}
                    <ol>${steps}</ol>
                    ${guide.setup.note ? `<div class="info-box">${escapeGuideHtml(guide.setup.note)}</div>` : ""}
                  `;
        }

        if (guide.sourceStatus === "panel-no-instructions") {
          return `
                    <h3>No product-specific instructions supplied</h3>
                    <p>The reseller listing for this product currently says that no instructions are available.</p>
                    <p>This page does not invent a loader password, key field, launch order, hotkey, or compatibility requirement. Use only the delivered file or portal shown below and contact support if it does not explain its own prompts.</p>
                  `;
        }

        if (guide.sourceStatus === "linked-source-unverified") {
          return `
                    <h3>Linked source requires verification</h3>
                    <p>The reseller listing includes a documentation link, but its product-specific contents were not verified well enough to reproduce here.</p>
                    <p>Use only the delivered file or portal shown below. Do not substitute another product's loader, password, key field, launch order, or hotkey.</p>
                  `;
        }

        return `
                    <h3>Product-specific instructions unavailable</h3>
                    <p>There is no verified product-specific installation sequence attached to this listing.</p>
                    <p>Use the delivered file or portal shown below and contact support before launching if the listing does not explain its own prompts.</p>
                  `;
      }

      function dedicatedRftTopics(guide) {
        const sourceLinks = [
          guideLink(guide.download, "Delivery/download"),
        ].filter(Boolean).join("");
        const dedicatedSetupFlow = setupFlowHtml(guide);

        return [
          {
            title: "Dedicated setup",
            content: `
                    <p>This is the dedicated XenCheats guide for <strong>${escapeGuideHtml(guide.name)}</strong>.</p>
                    ${dedicatedSetupFlow}
                    <h3>Verified listing links</h3>
                    <ul>${sourceLinks || "<li>No public delivery or documentation link was supplied for this listing.</li>"}</ul>
                    <div class="warn-box">If the product is Updating, Offline, Buggy, Testing, or otherwise unavailable, stop and wait for the listing status to clear. “Undetected” is not a guarantee.</div>
                  `,
          },
          {
            title: "Status & troubleshooting",
            content: `
                    <p>Keep this page with the exact order details when contacting support for <strong>${escapeGuideHtml(guide.name)}</strong>.</p>
                    <h3>When setup does not work</h3>
                    <ol>
                      <li>Stop using the product if its live status is not ready or the delivered file does not match the order.</li>
                      <li>Record the product name, selected term, game version, Windows version, and exact error text.</li>
                      <li>Do not mix files, passwords, hotkeys, or launch order from another listing.</li>
                      <li>Contact XenCheats support with the recorded details instead of repeatedly retrying an unavailable product.</li>
                    </ol>
                    <div class="info-box">This dedicated page contains the verified information available for this listing. Product-specific steps are added only when the source provides them.</div>
                  `,
          },
        ];
      }

      function buildDedicatedRftCategories() {
        const byCategory = new Map();
        dedicatedRftGuides.forEach((guide) => {
          if (!byCategory.has(guide.category)) byCategory.set(guide.category, []);
          byCategory.get(guide.category).push({
            name: guide.name,
            slug: guide.slug,
            topics: dedicatedRftTopics(guide),
          });
        });
        return [...byCategory.entries()].map(([name, products]) => ({ name, products }));
      }

      buildDedicatedRftCategories().forEach((dedicatedCategory) => {
        const existingCategory = categories.find((category) => category.name === dedicatedCategory.name);
        if (existingCategory) existingCategory.products.push(...dedicatedCategory.products);
        else categories.push(dedicatedCategory);
      });

      /* Keep legacy inline sections aligned with the current storefront. */
      categories.forEach((category) => {
        category.products = category.products.filter((product) => {
          if (/fragpunk|overwatch/i.test(`${category.name} ${product.name} ${product.slug}`)) return false;
          return !/^cod-/i.test(product.slug) || /^cod-bo7-/i.test(product.slug);
        });
      });
      for (let index = categories.length - 1; index >= 0; index -= 1) {
        if (!categories[index].products.length) categories.splice(index, 1);
      }

      /* ── Build flat topic list for navigation ── */
      const allTopics = [];
      categories.forEach(cat => {
        cat.products.forEach(prod => {
          prod.topics.forEach(topic => {
            allTopics.push({ category: cat.name, product: prod.name, slug: prod.slug, ...topic });
          });
        });
      });

      /* ── Render Sidebar ── */
      const sidebarNav = document.getElementById("sidebarNav");

      function buildSidebar(filter = "") {
        sidebarNav.innerHTML = "";
        const lf = filter.toLowerCase();

        categories.forEach(cat => {
          const filteredProducts = cat.products.filter(prod => {
            if (!lf) return true;
            if (prod.name.toLowerCase().includes(lf)) return true;
            if (cat.name.toLowerCase().includes(lf)) return true;
            return prod.topics.some(t => t.title.toLowerCase().includes(lf));
          });

          if (!filteredProducts.length) return;

          const catDiv = document.createElement("div");
          catDiv.className = "sidebar-category";

          const catHeader = document.createElement("div");
          catHeader.className = "sidebar-category-header";
          catHeader.innerHTML = `<span class="arrow">&#9660;</span><span class="cat-label">${cat.name}</span>`;
          catHeader.addEventListener("click", () => catDiv.classList.toggle("collapsed"));
          catDiv.appendChild(catHeader);

          const catBody = document.createElement("div");
          catBody.className = "sidebar-category-body";

          filteredProducts.forEach(prod => {
            const prodDiv = document.createElement("div");
            prodDiv.className = "sidebar-product";

            if (prod.topics.length > 1) {
              const prodHeader = document.createElement("div");
              prodHeader.className = "sidebar-product-header";
              prodHeader.innerHTML = `<span class="p-arrow">&#9660;</span>${prod.name}`;
              prodHeader.addEventListener("click", () => prodDiv.classList.toggle("collapsed"));
              prodDiv.appendChild(prodHeader);

              const prodBody = document.createElement("div");
              prodBody.className = "sidebar-product-body";

              prod.topics.forEach(topic => {
                const link = document.createElement("div");
                link.className = "sidebar-topic";
                link.textContent = topic.title;
                link.dataset.slug = prod.slug;
                link.dataset.topic = topic.title;
                link.addEventListener("click", () => showTopic(prod.slug, topic.title));
                prodBody.appendChild(link);
              });

              prodDiv.appendChild(prodBody);
            } else {
              const link = document.createElement("div");
              link.className = "sidebar-product-header";
              link.style.cursor = "pointer";
              link.innerHTML = prod.name;
              link.addEventListener("click", () => showTopic(prod.slug, prod.topics[0].title));
              prodDiv.appendChild(link);
            }

            catBody.appendChild(prodDiv);
          });

          catDiv.appendChild(catBody);
          sidebarNav.appendChild(catDiv);
        });
      }

      buildSidebar();

      /* ── Search ── */
      const searchInput = document.getElementById("docsSearch");
      searchInput.addEventListener("input", () => buildSidebar(searchInput.value));

      /* ── Show Topic ── */
      const contentEyebrow = document.getElementById("contentEyebrow");
      const contentTitle = document.getElementById("contentTitle");
      const contentBody = document.getElementById("contentBody");
      const contentNext = document.getElementById("contentNext");

      function escAttr(value) {
        return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[ch]));
      }

      /* The site's CSP is script-src 'self' (no 'unsafe-inline'), so an inline
         onclick="" attribute here is silently blocked by the browser and never
         fires — that's why "Next" did nothing. Wire it with addEventListener
         via delegation instead, since contentNext itself is never replaced. */
      contentNext.addEventListener("click", (event) => {
        const next = event.target.closest("[data-next-slug]");
        if (!next) return;
        showTopic(next.dataset.nextSlug, next.dataset.nextTitle);
      });

      function showTopic(slug, topicTitle) {
        const idx = allTopics.findIndex(t => t.slug === slug && t.title === topicTitle);
        if (idx === -1) return;

        const topic = allTopics[idx];
        if (contentEyebrow) {
          contentEyebrow.textContent = `${topic.category} · ${topic.product}`;
          contentEyebrow.hidden = false;
        }
        contentTitle.textContent = topic.title;
        contentBody.innerHTML = topic.content;

        // Next button
        if (idx < allTopics.length - 1) {
          const next = allTopics[idx + 1];
          contentNext.innerHTML = `
            <div class="docs-next" data-next-slug="${escAttr(next.slug)}" data-next-title="${escAttr(next.title)}">
              <div>
                <div class="docs-next-label">Next &middot; ${escAttr(next.product)}</div>
                <div class="docs-next-title">${escAttr(next.title)}</div>
              </div>
              <div class="docs-next-arrow">&#10095;</div>
            </div>
          `;
        } else {
          contentNext.innerHTML = "";
        }

        // Update active state in sidebar
        document.querySelectorAll(".sidebar-topic").forEach(el => el.classList.remove("active"));
        const activeLink = document.querySelector(`.sidebar-topic[data-slug="${slug}"][data-topic="${topicTitle}"]`);
        if (activeLink) {
          activeLink.classList.add("active");
          activeLink.scrollIntoView({ block: "nearest" });
        }

        // Update URL hash
        history.replaceState(null, "", `#${slug}/${encodeURIComponent(topicTitle)}`);

        // Close mobile sidebar
        document.getElementById("docsSidebar").classList.remove("open");

        // Scroll to top of content
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      window.__showTopic = showTopic;

      /* ── Handle hash on load ── */
      function loadFromHash() {
        const hash = location.hash.slice(1);
        if (!hash) {
          // Show first topic by default
          if (allTopics.length) showTopic(allTopics[0].slug, allTopics[0].title);
          return;
        }

        const parts = hash.split("/");
        const slug = parts[0];
        const topicTitle = parts[1] ? decodeURIComponent(parts[1]) : null;

        if (topicTitle) {
          const found = allTopics.find(t => t.slug === slug && t.title === topicTitle);
          if (found) { showTopic(slug, topicTitle); return; }
        }

        // Fall back to first topic of that product
        const first = allTopics.find(t => t.slug === slug);
        if (first) showTopic(first.slug, first.title);
        else if (allTopics.length) showTopic(allTopics[0].slug, allTopics[0].title);
      }

      loadFromHash();
      window.addEventListener("hashchange", loadFromHash);

      async function refreshLiveGuideStatuses() {
        try {
          const response = await fetch("/api/products", { cache: "no-store" });
          if (!response.ok) return;
          const payload = await response.json();
          const liveProducts = Array.isArray(payload) ? payload : payload.products || [];
          const statusBySlug = new Map(liveProducts.map((product) => [product.slug, product.badge]));
          document.querySelectorAll("[data-live-product-status]").forEach((element) => {
            const rawStatus = statusBySlug.get(element.dataset.liveProductStatus);
            if (!rawStatus) return;
            const status = /^online$/i.test(rawStatus)
              ? "Undetected"
              : (/discontinued|\bdetected\b|retired|removed/i.test(rawStatus) ? "Updating" : rawStatus);
            element.textContent = status;
          });
        } catch {
          /* The static fallback remains visible if the live catalog is briefly unavailable. */
        }
      }

      refreshLiveGuideStatuses();
      setInterval(refreshLiveGuideStatuses, 60_000);

      /* ── Mobile toggle ── */
      document.getElementById("mobileToggle").addEventListener("click", () => {
        document.getElementById("docsSidebar").classList.toggle("open");
      });

      document.getElementById("docsOverlay").addEventListener("click", () => {
        document.getElementById("docsSidebar").classList.remove("open");
      });
    </script>
