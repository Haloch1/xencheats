<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/nox-logo.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <title>Order Complete | XenCheats</title>
    <meta name="description" content="Your XenCheats order is complete." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles-v2.css" />
    <style>
      .order-result {
        text-align: center;
        padding: 20px 0;
      }
      .order-result h2 {
        margin-bottom: 8px;
      }
      .order-result .order-subtitle {
        color: var(--muted);
        margin-bottom: 24px;
      }
      .key-display {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        margin: 20px 0;
      }
      .key-display .key-label {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .key-display .key-value {
        font-family: "Oxanium", monospace;
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 0.08em;
        word-break: break-all;
        user-select: all;
      }
      .key-display .copy-btn {
        margin-top: 12px;
        background: var(--accent);
        color: #000;
        border: none;
        padding: 8px 20px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.9rem;
        transition: opacity 0.2s;
      }
      .key-display .copy-btn:hover {
        opacity: 0.85;
      }
      .order-meta {
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 16px;
      }
      .order-meta span {
        display: block;
        margin-bottom: 4px;
      }
      .loading-spinner {
        color: var(--muted);
        padding: 40px 0;
        text-align: center;
      }

      .delivered-items {
        margin: 28px 0;
        text-align: left;
      }

      .delivered-items-heading {
        align-items: center;
        color: var(--muted);
        display: flex;
        font-size: 0.78rem;
        font-weight: 700;
        justify-content: space-between;
        letter-spacing: 0.09em;
        margin: 0 0 12px;
        text-transform: uppercase;
      }

      .delivery-actions {
        display: flex;
        gap: 8px;
      }

      .delivery-item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        margin: 10px 0;
        overflow: hidden;
      }

      .delivery-item-heading {
        align-items: center;
        cursor: pointer;
        display: flex;
        gap: 14px;
        justify-content: space-between;
        list-style: none;
        padding: 18px 20px;
      }

      .delivery-item-heading::-webkit-details-marker { display: none; }
      .delivery-item-heading strong { display: block; color: var(--text); }
      .delivery-item-heading small { color: var(--muted); display: block; margin-top: 4px; }

      .delivery-status {
        border: 1px solid currentColor;
        border-radius: 999px;
        font-size: 0.72rem;
        padding: 4px 9px;
        white-space: nowrap;
      }

      .delivery-status.is-delivered { color: #38e889; }
      .delivery-status.is-processing { color: var(--muted); }

      .delivery-item-body {
        border-top: 1px solid var(--border);
        padding: 20px;
      }

      .delivery-section-label {
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin: 0 0 10px;
        text-transform: uppercase;
      }

      .delivery-instructions {
        color: var(--text);
        margin: 0 0 22px;
        padding-left: 22px;
      }

      .delivery-instructions li { margin: 8px 0; padding-left: 4px; }

      .delivery-value-wrap {
        align-items: flex-start;
        display: flex;
        gap: 10px;
      }

      .delivery-value {
        background: #09090d;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        flex: 1;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.84rem;
        line-height: 1.55;
        overflow-wrap: anywhere;
        padding: 12px;
        user-select: all;
        white-space: pre-wrap;
      }

      .delivery-guide-link { display: inline-block; margin-top: 14px; }
      .delivery-processing-copy { color: var(--muted); margin: 0; }

      @media (max-width: 640px) {
        .delivery-item-heading { align-items: flex-start; flex-direction: column; }
        .delivery-value-wrap { flex-direction: column; }
        .delivery-value-wrap .copy-btn { width: 100%; }
        .delivered-items-heading { align-items: flex-start; flex-direction: column; gap: 10px; }
      }
    </style>
  </head>
  <body>
    <div class="page-shell page-shell-inner">
      <div class="ambient ambient-left"></div>
      <div class="ambient ambient-right"></div>

      <main class="section checkout-state">
      <h1 class="sr-only">Order complete</h1>
        <div class="auth-card auth-card-dashboard" id="orderCard">
          <div class="loading-spinner" id="orderLoading">Verifying your payment...</div>
          <div id="orderContent" style="display:none;"></div>
        </div>
      </main>
    </div>

    <script type="module" src="../../scripts/checkout-page.js"></script>
    <script type="module" src="../../scripts/effects.js"></script>
    <script type="module" src="../../scripts/site.js"></script>
  </body>
</html>
