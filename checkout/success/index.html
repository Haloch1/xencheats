<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/nox-logo.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <title>Order Complete | XenCheats</title>
    <meta name="description" content="Your XenCheats order is complete." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../styles-v2.css" />
    <style>
      .order-result {
        text-align: center;
        padding: 20px 0;
      }
      .order-result h2 {
        margin-bottom: 8px;
      }
      .order-result .order-subtitle {
        color: var(--muted);
        margin-bottom: 24px;
      }
      .key-display {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        margin: 20px 0;
      }
      .key-display .key-label {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .key-display .key-value {
        font-family: "Oxanium", monospace;
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 0.08em;
        word-break: break-all;
        user-select: all;
      }
      .key-display .copy-btn {
        margin-top: 12px;
        background: var(--accent);
        color: #000;
        border: none;
        padding: 8px 20px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.9rem;
        transition: opacity 0.2s;
      }
      .key-display .copy-btn:hover {
        opacity: 0.85;
      }
      .order-meta {
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 16px;
      }
      .order-meta span {
        display: block;
        margin-bottom: 4px;
      }
      .loading-spinner {
        color: var(--muted);
        padding: 40px 0;
        text-align: center;
      }

      .delivered-items {
        margin: 28px 0;
        text-align: left;
      }

      .delivered-items-heading {
        align-items: center;
        color: var(--muted);
        display: flex;
        font-size: 0.78rem;
        font-weight: 700;
        justify-content: space-between;
        letter-spacing: 0.09em;
        margin: 0 0 12px;
        text-transform: uppercase;
      }

      .delivery-actions {
        display: flex;
        gap: 8px;
      }

      .delivery-item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        margin: 10px 0;
        overflow: hidden;
      }

      .delivery-item-heading {
        align-items: center;
        cursor: pointer;
        display: flex;
        gap: 14px;
        justify-content: space-between;
        list-style: none;
        padding: 18px 20px;
      }

      .delivery-item-heading::-webkit-details-marker { display: none; }
      .delivery-item-heading strong { display: block; color: var(--text); }
      .delivery-item-heading small { color: var(--muted); display: block; margin-top: 4px; }

      .delivery-status {
        border: 1px solid currentColor;
        border-radius: 999px;
        font-size: 0.72rem;
        padding: 4px 9px;
        white-space: nowrap;
      }

      .delivery-status.is-delivered { color: #38e889; }
      .delivery-status.is-processing { color: var(--muted); }

      .delivery-item-body {
        border-top: 1px solid var(--border);
        padding: 20px;
      }

      .delivery-section-label {
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin: 0 0 10px;
        text-transform: uppercase;
      }

      .delivery-instructions {
        color: var(--text);
        margin: 0 0 22px;
        padding-left: 22px;
      }

      .delivery-instructions > div { margin: 8px 0; padding-left: 4px; }

      .delivery-value-wrap {
        align-items: flex-start;
        display: flex;
        gap: 10px;
      }

      .delivery-value {
        background: #09090d;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        flex: 1;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.84rem;
        line-height: 1.55;
        overflow-wrap: anywhere;
        padding: 12px;
        user-select: all;
        white-space: pre-wrap;
      }

      .delivery-guide-link { display: inline-block; margin-top: 14px; }
      .delivery-processing-copy { color: var(--muted); margin: 0; }

      @media (max-width: 640px) {
        .delivery-item-heading { align-items: flex-start; flex-direction: column; }
        .delivery-value-wrap { flex-direction: column; }
        .delivery-value-wrap .copy-btn { width: 100%; }
        .delivered-items-heading { align-items: flex-start; flex-direction: column; gap: 10px; }
      }

      #orderCard {
        max-width: 1080px;
        overflow: hidden;
        padding: 0;
      }

      #orderContent { padding: 34px 42px 42px; }

      .order-result {
        padding: 0;
        text-align: left;
      }

      .checkout-progress {
        align-items: center;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 0;
        justify-content: center;
        padding: 22px 34px;
      }

      .progress-step {
        align-items: center;
        color: var(--muted);
        display: flex;
        font-size: 0.66rem;
        font-weight: 700;
        gap: 8px;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .progress-step::after {
        background: var(--border);
        content: "";
        height: 1px;
        margin: 0 12px;
        width: clamp(18px, 5vw, 72px);
      }

      .progress-step:last-child::after { display: none; }
      .progress-step.is-done { color: var(--text); }
      .progress-step.is-current { color: var(--text); }
      .progress-dot {
        align-items: center;
        background: #24102d;
        border: 1px solid #9b22a8;
        border-radius: 50%;
        color: #f08cff;
        display: inline-flex;
        font-size: 0.7rem;
        height: 22px;
        justify-content: center;
        width: 22px;
      }

      .progress-step.is-current .progress-dot {
        background: #3a133f;
        border-color: #ff4fd8;
        color: #fff;
      }

      .success-hero {
        padding: 32px 0 28px;
        text-align: center;
      }

      .success-icon {
        align-items: center;
        background: rgba(44, 224, 125, 0.1);
        border: 1px solid rgba(44, 224, 125, 0.45);
        border-radius: 50%;
        color: #49e98a;
        display: inline-flex;
        height: 68px;
        justify-content: center;
        margin-bottom: 18px;
        width: 68px;
      }

      .success-icon svg { height: 34px; width: 34px; }
      .success-hero .eyebrow { margin-bottom: 10px; }
      .success-hero h2 { font-size: clamp(1.8rem, 3vw, 2.2rem); margin: 0 0 10px; }
      .success-hero .order-subtitle { margin: 0; }

      .order-summary {
        align-items: center;
        background: linear-gradient(135deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
        border: 1px solid var(--border);
        border-radius: 14px;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin: 0 0 30px;
        padding: 18px 20px;
      }

      .order-summary-label { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }
      .order-summary strong { display: block; margin-top: 5px; }
      .order-summary-id { color: var(--muted); font-family: "JetBrains Mono", monospace; font-size: 0.75rem; }

      .delivered-items { margin: 0; }
      .delivered-items-heading { margin-bottom: 14px; }
      .delivered-items-heading > span { color: var(--text); font-size: 0.9rem; }
      .delivery-item { background: rgba(255,255,255,0.025); border-radius: 14px; margin: 14px 0; }
      .delivery-item-heading { padding: 21px 22px; }
      .delivery-item-body { background: rgba(0,0,0,0.12); padding: 24px 22px 22px; }
      .delivery-instructions { padding: 0; }
      .delivery-instructions > div { align-items: flex-start; display: flex; gap: 12px; margin: 12px 0; padding: 0; }
      .delivery-step-number { align-items: center; background: #29162e; border: 1px solid #713b7b; border-radius: 50%; color: #f3a5ff; display: inline-flex; flex: 0 0 24px; font-size: 0.72rem; height: 24px; justify-content: center; margin-top: -2px; }
      .delivery-value-wrap { align-items: stretch; background: #08090d; border: 1px solid #2d303c; border-radius: 10px; padding: 8px; }
      .delivery-value { background: transparent; border: 0; min-height: 84px; padding: 8px 10px; }
      .delivery-value-wrap .copy-btn { align-self: flex-start; margin: 8px; margin-left: 0; white-space: nowrap; }
      .delivery-guide-link { color: #f18cff; font-weight: 600; }

      .order-meta { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; margin-top: 24px; padding: 16px 18px; }
      .order-meta span { margin-bottom: 7px; }
      .order-meta span:last-child { margin-bottom: 0; }
      .dashboard-actions { border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; padding-top: 24px; }

      @media (max-width: 700px) {
        #orderContent { padding: 22px 18px 28px; }
        .checkout-progress { justify-content: flex-start; overflow-x: auto; padding: 18px; }
        .progress-step::after { margin: 0 8px; width: 24px; }
        .order-summary { align-items: flex-start; flex-direction: column; }
        .delivery-value-wrap .copy-btn { margin: 8px 0 0; }
        .dashboard-actions { flex-direction: column; }
        .dashboard-actions .button { width: 100%; }
      }

      /* SellAuth-inspired checkout shell: order context stays visible while
         delivery content gets the space and focus on the right. */
      #orderCard {
        background: rgba(15, 11, 17, 0.96);
        border-color: rgba(255, 255, 255, 0.12);
        max-width: 1220px;
        text-align: left;
        width: min(1220px, 100%);
      }

      #orderContent { padding: 0; }
      .checkout-layout { display: grid; grid-template-columns: minmax(270px, 31%) minmax(0, 1fr); min-height: 700px; }
      .checkout-sidebar { background: rgba(255, 255, 255, 0.025); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 38px 34px 30px; }
      .checkout-brand { align-items: center; color: var(--text); display: inline-flex; font-family: Sora, sans-serif; font-size: 1.05rem; font-weight: 800; gap: 11px; text-decoration: none; }
      .checkout-brand-mark { align-items: center; background: linear-gradient(135deg, #ff4fd8, #6d22a8); border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 9px; box-shadow: 0 8px 24px rgba(255, 79, 216, 0.2); color: #fff; display: inline-flex; font-size: 0.86rem; height: 32px; justify-content: center; width: 32px; }
      .sidebar-total { border-bottom: 1px solid var(--border); margin-top: 60px; padding-bottom: 26px; }
      .sidebar-kicker, .sidebar-product-copy small { color: var(--muted); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
      .sidebar-total strong { color: var(--text); display: block; font-family: Sora, sans-serif; font-size: clamp(2.2rem, 4vw, 3.25rem); letter-spacing: -0.06em; line-height: 1; margin-top: 12px; }
      .sidebar-product { align-items: center; border-bottom: 1px solid var(--border); display: flex; gap: 13px; padding: 24px 0; }
      .sidebar-product-art { align-items: center; background: linear-gradient(145deg, #39103e, #160d1b); border: 1px solid #64256d; border-radius: 10px; color: #ff78e5; display: inline-flex; flex: 0 0 48px; font-family: Sora, sans-serif; font-size: 0.78rem; font-weight: 800; height: 48px; justify-content: center; }
      .sidebar-product-copy { min-width: 0; }
      .sidebar-product-copy strong { color: var(--text); display: block; font-size: 0.88rem; line-height: 1.35; overflow-wrap: anywhere; }
      .sidebar-product-copy small { display: block; letter-spacing: 0.04em; margin-top: 5px; text-transform: none; }
      .sidebar-breakdown { border-bottom: 1px solid var(--border); padding: 20px 0; }
      .sidebar-breakdown div { align-items: center; color: var(--muted); display: flex; font-size: 0.82rem; justify-content: space-between; margin: 10px 0; }
      .sidebar-breakdown div:first-child { margin-top: 0; }
      .sidebar-breakdown div:last-child { margin-bottom: 0; }
      .sidebar-breakdown strong { color: var(--text); font-weight: 600; }
      .sidebar-status { color: #45e98a !important; }
      .sidebar-email { align-items: flex-start; display: flex; gap: 12px; margin-top: auto; padding-top: 30px; }
      .sidebar-email-icon { align-items: center; border: 1px solid #55505a; border-radius: 6px; color: #bdb5c4; display: inline-flex; flex: 0 0 27px; font-size: 0.85rem; height: 27px; justify-content: center; }
      .sidebar-email strong { color: var(--text); display: block; font-size: 0.82rem; }
      .sidebar-email p { color: #9f94a5; font-size: 0.77rem; line-height: 1.5; margin: 5px 0 2px; }
      .sidebar-email p b { color: #e8dfea; font-weight: 600; overflow-wrap: anywhere; }
      .sidebar-email small { color: #716879; display: block; font-size: 0.7rem; line-height: 1.45; }
      .sidebar-help { color: #f18cff; font-size: 0.76rem; font-weight: 600; margin-top: 24px; text-decoration: none; }
      .sidebar-help span { display: inline-block; margin-left: 4px; transition: transform 0.2s ease; }
      .sidebar-help:hover span { transform: translateX(3px); }
      .checkout-main { min-width: 0; padding: 0 46px 42px; }
      .checkout-main .checkout-progress { margin: 0 -46px; }
      .checkout-progress { background: rgba(0, 0, 0, 0.08); border-color: rgba(255, 255, 255, 0.09); }
      .progress-step::after { background: linear-gradient(90deg, #742285, #d23bc1); }
      .success-hero { padding: 50px 0 34px; }
      .success-icon { box-shadow: 0 0 0 8px rgba(44, 224, 125, 0.035), 0 14px 34px rgba(44, 224, 125, 0.12); }
      .success-hero h2 { font-size: clamp(2rem, 3.2vw, 2.65rem); letter-spacing: -0.045em; }
      .success-hero .order-subtitle { font-size: 0.95rem; }
      .delivered-items-heading { align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 13px; }
      .delivered-items-heading > span { font-family: Sora, sans-serif; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; }
      .delivery-actions .button { min-width: 98px; }
      .delivery-item { background: rgba(255, 255, 255, 0.03); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12); }
      .delivery-item:hover { border-color: rgba(255, 79, 216, 0.32); }
      .delivery-item-heading { min-height: 72px; }
      .delivery-item-heading > span:first-child { min-width: 0; }
      .delivery-item-heading strong { font-size: 0.94rem; }
      .delivery-heading-meta { align-items: center; display: flex; gap: 12px; }
      .delivery-chevron { color: var(--muted); display: inline-flex; font-size: 1rem; transition: transform 0.2s ease; }
      .delivery-item[open] .delivery-chevron { transform: rotate(180deg); }
      .delivery-status { background: rgba(56, 232, 137, 0.06); font-weight: 700; }
      .delivery-item-body { padding: 28px 24px 25px; }
      .delivery-section-label { font-size: 0.7rem; letter-spacing: 0.12em; }
      .delivery-instructions > div { line-height: 1.5; }
      .delivery-value-wrap { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02); }
      .delivery-value { font-size: 0.8rem; }
      .order-meta { font-size: 0.78rem; }

      @media (max-width: 860px) {
        .checkout-layout { grid-template-columns: 1fr; }
        .checkout-sidebar { border-bottom: 1px solid var(--border); border-right: 0; padding: 26px 28px 24px; }
        .sidebar-total { margin-top: 30px; }
        .sidebar-total strong { font-size: 2.45rem; }
        .sidebar-email { margin-top: 25px; padding-top: 0; }
        .sidebar-help { margin-top: 20px; }
        .checkout-main { padding: 0 28px 30px; }
        .checkout-main .checkout-progress { margin: 0 -28px; }
      }

      @media (max-width: 560px) {
        .checkout-sidebar { padding: 22px 20px; }
        .checkout-main { padding: 0 18px 24px; }
        .checkout-main .checkout-progress { margin: 0 -18px; }
        .checkout-progress { justify-content: flex-start; overflow-x: auto; padding: 16px 18px; }
        .progress-step { font-size: 0.62rem; }
        .progress-step::after { margin: 0 8px; width: 22px; }
        .success-hero { padding: 36px 0 26px; }
        .success-hero h2 { font-size: 1.9rem; }
        .delivery-item-body { padding: 22px 18px; }
      }
    </style>
  </head>
  <body>
    <div class="page-shell page-shell-inner">
      <div class="ambient ambient-left"></div>
      <div class="ambient ambient-right"></div>

      <main class="section checkout-state">
      <h1 class="sr-only">Order complete</h1>
        <div class="auth-card auth-card-dashboard" id="orderCard">
          <div class="loading-spinner" id="orderLoading">Verifying your payment...</div>
          <div id="orderContent" style="display:none;"></div>
        </div>
      </main>
    </div>

    <script type="module" src="../../scripts/checkout-page.js"></script>
    <script type="module" src="../../scripts/effects.js"></script>
    <script type="module" src="../../scripts/site.js"></script>
  </body>
</html>
